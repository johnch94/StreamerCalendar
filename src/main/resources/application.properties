spring.application.name=streamercalendar

# DB 접속 정보는 git에 올리지 않는 application-secret.properties에서 읽는다.
# 최초 세팅: application-secret.properties.example을 복사해 application-secret.properties로 만들고 값 입력
# (환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD가 있으면 그 값이 우선 적용됨)
spring.config.import=optional:classpath:application-secret.properties

# MVP 단계: 엔티티 변경 시 스키마 자동 반영 (운영 전 validate/none으로 전환 필요)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 관리자 로그인 세션 쿠키. SameSite=Lax라 다른 사이트에서 보낸 쓰기 요청에는 쿠키가 실리지 않는다 (SecurityConfig 주석 참고)
# 운영(HTTPS)에서는 SERVER_SERVLET_SESSION_COOKIE_SECURE=true로 Secure 속성도 켤 것
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# ---- 배포 (Render) ----
# Render는 PORT 환경변수로 포트를 지정한다. 로컬은 8080
server.port=${PORT:8080}
# Render/Vercel 프록시가 붙이는 X-Forwarded-Proto를 신뢰해 HTTPS 요청으로 인식한다 (remember-me 쿠키 Secure 판단에 필요)
server.forward-headers-strategy=native

# CORS 허용 origin (쉼표로 여러 개). 운영은 Vercel이 /api를 같은 도메인으로 프록시하므로 CORS가 필요 없다
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
