spring.application.name=streamercalendar

# DB 접속 정보는 git에 올리지 않는 application-secret.properties에서 읽는다.
# 최초 세팅: application-secret.properties.example을 복사해 application-secret.properties로 만들고 값 입력
# (환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD가 있으면 그 값이 우선 적용됨)
spring.config.import=optional:classpath:application-secret.properties

# MVP 단계: 엔티티 변경 시 스키마 자동 반영 (운영 전 validate/none으로 전환 필요)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
